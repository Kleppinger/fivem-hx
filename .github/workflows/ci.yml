name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Haxe
        uses: krdlab/setup-haxe@v1
        with:
          haxe-version: 4.3.7

      - name: Type-check fivem.shared
        run: haxe test-shared.hxml

      - name: Type-check fivem.server
        run: haxe test-server.hxml

      - name: Type-check fivem.client
        run: haxe test-client.hxml

      - name: Link fivem-hx to this checkout
        run: haxelib dev fivem-hx .

      - name: Build example resource (client)
        working-directory: examples/basic-resource
        run: haxe client.hxml

      - name: Build example resource (server)
        working-directory: examples/basic-resource
        run: haxe server.hxml

      # The core-demo example is the only place the object-oriented layer is
      # exercised end to end, so a break there is a real regression.
      - name: Build core-demo example (client)
        working-directory: examples/core-demo
        run: haxe client.hxml

      - name: Build core-demo example (server)
        working-directory: examples/core-demo
        run: haxe server.hxml

      # Haxe compiling cleanly does not mean the Lua it emitted parses: the
      # Lua target can generate syntactically invalid output (see
      # docs/troubleshooting.md), and FXServer only finds out at load time.
      # luac -p parses without executing, so no runtime deps are needed.
      - name: Install Lua for syntax checking
        run: sudo apt-get update && sudo apt-get install -y lua5.4

      - name: Check that generated Lua parses
        run: |
          set -e
          for file in test-*-check.lua examples/*/dist/*/*.lua; do
            echo "parsing $file"
            luac5.4 -p "$file"
          done

      # Parsing is not enough: Haxe's Lua target emits top-level require()
      # calls for native modules FXServer does not ship (hxsimdjson, pulled in
      # by haxe.Json, is the one that bit us). Those load-time failures kill
      # the whole resource, so the set of required modules is allowlisted.
      # lua-utf8/utf8 and luv are the two the example patch script handles.
      - name: Check for unshippable Lua module requires
        run: |
          set -e
          grep -ho 'require("[A-Za-z0-9_.-]*")' test-*-check.lua examples/*/dist/*/*.lua | sort -u > /tmp/requires.txt
          cat /tmp/requires.txt
          if grep -vE 'require\("(lua-utf8|utf8|luv)"\)' /tmp/requires.txt; then
            echo "::error::generated Lua requires a module FXServer does not ship (see above)"
            exit 1
          fi
          echo "only expected modules are required"

      # Haxe compiles bitwise operators to a _hx_bit shim that requires the
      # bit32 or bit module. Lua 5.3/5.4 has native bitwise operators and so
      # ships neither, and the shim runs at load time — so a single `|` or a
      # call to StringTools.hex takes the whole resource down. No compiler
      # define avoids it; fivem.shared.util.Bits emits Lua's operators
      # directly instead. See docs/haxe-fivem-tips.md.
      - name: Check for the bit32 shim
        run: |
          set -e
          if grep -l "Failed to load bit or bit32" test-*-check.lua examples/*/dist/*/*.lua; then
            echo "::error::generated Lua contains the _hx_bit shim; use fivem.shared.util.Bits instead of Haxe bitwise operators"
            exit 1
          fi
          echo "no bit shim in generated output"

      # Natives are exposed on _G under CitizenFX's generated Lua name
      # (GetCurrentResourceName), never under the SCREAMING_SNAKE name from
      # the natives database — that spelling does not exist in the runtime,
      # and calling it fails with "attempt to call a nil value". Regenerating
      # with an older generate.py would silently reintroduce it, so the
      # externs are linted for the database spelling.
      - name: Check native names use the runtime's Lua spelling
        run: |
          set -e
          if grep -rhoE '@:native\("[A-Z][A-Z_0-9]{3,}"\)' src/fivem/*/natives/*.hx src/fivem/shared/Runtime.hx src/fivem/client/NativeOutputs.hx | sort -u | grep .; then
            echo "::error::@:native uses the natives-database spelling; it must be the Lua name (see generate.py to_lua_name)"
            exit 1
          fi
          echo "all @:native names use the runtime spelling"

      # FiveM's client sandbox does not expose the `os` library. Haxe emits
      # `_G.math.randomseed(_G.os.time())` at file scope as soon as anything
      # uses Math.random or Std.random, and that runs at load time — so the
      # resource dies before any of its own code does. Anything at column 0
      # runs on load, so that is what is checked; os/io *inside* a function
      # body (haxe.Date) is fine as long as it is never called client-side.
      - name: Check for load-time os/io access
        run: |
          set -e
          if grep -nE "^[^[:space:]].*_G\.(os|io)\." test-*-check.lua examples/*/dist/*/*.lua; then
            echo "::error::generated Lua touches os/io at load time; FiveM's client sandbox has neither (use MathUtil.random instead of Math.random)"
            exit 1
          fi
          echo "no load-time os/io access"
