name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Haxe
        uses: krdlab/setup-haxe@v1
        with:
          haxe-version: 4.3.7

      - name: Type-check fivem.shared
        run: haxe test-shared.hxml

      - name: Type-check fivem.server
        run: haxe test-server.hxml

      - name: Type-check fivem.client
        run: haxe test-client.hxml

      - name: Link fivem-hx to this checkout
        run: haxelib dev fivem-hx .

      - name: Build example resource (client)
        working-directory: examples/basic-resource
        run: haxe client.hxml

      - name: Build example resource (server)
        working-directory: examples/basic-resource
        run: haxe server.hxml

      # The core-demo example is the only place the object-oriented layer is
      # exercised end to end, so a break there is a real regression.
      - name: Build core-demo example (client)
        working-directory: examples/core-demo
        run: haxe client.hxml

      - name: Build core-demo example (server)
        working-directory: examples/core-demo
        run: haxe server.hxml
